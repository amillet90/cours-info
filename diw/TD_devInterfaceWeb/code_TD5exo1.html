<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Formulaires</title>

    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0" />
</head>
<body>

    <header>
        <div>
            <input type="checkbox" name="all" id="all" checked>
            <label for="all">Tout</label>
        </div>
        <div>
            <input type="checkbox" name="contact" id="contact">
            <label for="contact">Contact</label>
        </div>
        <div>
            <input type="checkbox" name="files" id="files">
            <label for="files">Fichiers</label>
        </div>
        <div>
            <input type="checkbox" name="links" id="links">
            <label for="links">Liens</label>
        </div>
        <div>
            <input type="checkbox" name="notes" id="notes">
            <label for="notes">Notes</label>
        </div>
    </header>

    <div id="content">
        <section>
            <div class="half-line">
                <div>
                    <h2>Prenom</h2>
                    <input type="text" name="prenom" id="prenom" placeholder="Entrez votre prenom">
                </div>
                <div>
                    <h2>Nom</h2>
                    <input type="text" name="nom" id="nom" placeholder="Entrez votre nom">
                </div>
            </div>
            <div class="line">
                <h2>Email</h2>
                <input type="email" name="email" id="email" placeholder="votre-email@domaine.ex">
            </div>
            <div class="half-line">
                <div>
                    <h2>Date</h2>
                    <input type="text" name="date" id="date" placeholder="jj/mm/aaaa">
                </div>
                <div>
                    <h2>Horaire</h2>
                    <input type="text" name="horaire" id="horaire" placeholder="hh:mm">
                </div>
            </div>
            <div class="line">
                <h2>Notifications</h2>&nbsp;
                <input type="checkbox" name="notifications" id="notifications">
                <label for="notifications"></label>
            </div>
            <button>Envoyer</button>
        </section>

        <section>
            <div class="line">
                <h2>Envoyer à</h2>
                <input type="email" name="email" id="email" placeholder="votre-email@domaine.ex">
            </div>

            <div class="line">
                <h2>Uploader des Fichiers</h2>
                <input type="file" name="upload-files" id="upload-files" multiple>
                <label for="upload-files" class="file-upload">
                    <span>Déposez vos fichiers</span>
                    <span class="material-symbols-outlined">cloud_upload</span>
                </label>
            </div>

            <div class="line">
                <div class="file">
                    <div>
                        <span>image.png</span>
                        <span class="material-symbols-outlined">close</span>
                    </div>
                    <progress value="70" max="100"></progress>
                </div>

                <div class="file">
                    <div>
                        <span>document.pdf</span>
                        <span class="material-symbols-outlined">close</span>
                    </div>
                </div>

                <div class="file">
                    <div>
                        <span>page.html</span>
                        <span class="material-symbols-outlined">close</span>
                    </div>
                </div>

                <div class="file">
                    <div>
                        <span>archive.tar.gz</span>
                        <span class="material-symbols-outlined">close</span>
                    </div>
                    <progress value="80" max="100"></progress>
                </div>
            </div>
            <button>Envoyer</button>
        </section>


        <section>
            <div class="line">
                <h2>Nom complet</h2>
                <input type="text" name="mail-text" id="mail-fullname" placeholder="Nom et prénom">
            </div>
            <div class="line">
                <h2>Destinataire</h2>
                <input type="email" name="mail-email" id="mail-email" placeholder="votre-email@domaine.ex">
            </div>

            <div class="line">
                <h2>Objet</h2>
                <input type="text" name="mail-topic" id="mail-topic" placeholder="Sujet du mail">
            </div>
            <div class="line">
                <h2>Message</h2>
                <textarea name="mail-message" id="mail-message" placeholder="Votre message"> </textarea>
            </div>
            <button>Envoyer</button>
        </section>
    </div>
</body>
</html>
